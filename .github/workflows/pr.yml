name: Pull Requests
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:3.2
        ports:
          - 27017:27017
    steps:
      - name: Checkout source code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - name: Set up JDK 11.0.11
        uses: actions/setup-java@b6e674f4b717d7b0ae3baee0fbe79f498905dfde # v1
        with:
          java-version: 11.0.11
      - name: Run local migration
        run: ./gradlew run
      - uses: kentaro-m/auto-assign-action@33184f4b3be6d5d3974987dec054293c57a5af4c # v1.1.2
        with:
          configuration-path: ".github/auto_assign.yml"
